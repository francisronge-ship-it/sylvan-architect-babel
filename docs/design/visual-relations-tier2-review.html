<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Babel Tier 2 Visual Review</title>
  <link rel="stylesheet" href="./visual-relations-tier2-review.production.css">
  <style>
    * { box-sizing: border-box; }
    html { background: #00110c; color: #ecfdf5; }
    body { margin: 0; font-family: "JetBrains Mono", ui-monospace, monospace; }
    main { width: min(1560px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 60px; }
    .tier2-review-header { display: flex; align-items: end; gap: 28px; margin-bottom: 24px; }
    .tier2-review-header p { margin: 0 0 6px; color: #6ee7b7; font-size: 11px; text-transform: uppercase; }
    .tier2-review-header h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    .tier2-review-header dl { display: flex; gap: 18px; margin: 0 0 2px auto; }
    .tier2-review-header dl div { display: grid; gap: 3px; }
    .tier2-review-header dt { color: rgba(167,243,208,.62); font-size: 9px; text-transform: uppercase; }
    .tier2-review-header dd { margin: 0; font-size: 13px; }
    .tier2-stacking-fixture { display: grid; grid-template-columns: minmax(0, 1fr) 396px; gap: 24px; align-items: center; margin-bottom: 20px; padding: 18px 22px; border: 1px solid rgba(110,231,183,.24); border-radius: 6px; background: rgba(0,12,8,.9); }
    .tier2-stacking-fixture > header { align-self: start; display: grid; gap: 14px; }
    .tier2-stacking-fixture p { margin: 0 0 6px; color: #6ee7b7; font-size: 9px; text-transform: uppercase; }
    .tier2-stacking-fixture h2 { margin: 0; font-size: 16px; letter-spacing: 0; }
    .tier2-stacking-fixture code { width: max-content; color: #a7f3d0; font-size: 10px; }
    .tier2-stacking-fixture svg { display: block; width: 100%; max-height: 430px; }
    .tier2-stacking-anchor { fill: #34d399; }
    .tier2-stacking-anchor-label { fill: #a7f3d0; font: 11px "JetBrains Mono", monospace; text-anchor: middle; }
    .tier2-stacking-anchor-line { stroke: rgba(52,211,153,.48); stroke-width: 1.5; stroke-dasharray: 5 5; }
    .tier2-review-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .tier2-review-pair { min-width: 0; overflow: hidden; border: 1px solid rgba(110,231,183,.18); border-radius: 6px; background: rgba(0,12,8,.86); }
    .tier2-review-pair > header { display: flex; align-items: baseline; gap: 12px; padding: 11px 13px; border-bottom: 1px solid rgba(110,231,183,.13); }
    .tier2-review-pair h2 { margin: 0; font-size: 11px; letter-spacing: 0; }
    .tier2-review-pair code { margin-left: auto; color: rgba(110,231,183,.65); font-size: 9px; }
    .tier2-review-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tier2-review-columns > section { min-width: 0; padding: 8px; }
    .tier2-review-columns > section + section { box-shadow: inset 1px 0 rgba(110,231,183,.13); }
    .tier2-review-columns > section > span { display: block; padding: 0 4px 6px; color: rgba(236,253,245,.54); font-size: 8px; text-transform: uppercase; }
    .babel-vocabulary-specimen { min-width: 0; overflow: hidden; border: 1px solid rgba(110,231,183,.15); border-radius: 4px; background: radial-gradient(circle at 1px 1px, rgba(110,231,183,.08) 1px, transparent 1.2px) 0 0 / 20px 20px, rgba(0,18,12,.72); }
    .babel-vocabulary-specimen h3 { margin: 0; padding: 9px 10px 0; color: rgba(236,253,245,.7); font-size: 8px; font-weight: 650; text-transform: uppercase; }
    .babel-vocabulary-specimen svg { display: block; width: 100%; aspect-ratio: 16 / 9; overflow: visible; }
    @media (max-width: 980px) {
      .tier2-review-grid { grid-template-columns: 1fr; }
      .tier2-review-header { align-items: start; flex-direction: column; }
      .tier2-review-header dl { margin-left: 0; }
      .tier2-stacking-fixture { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="babel-tier2-visual-review"></div>
  <script src="./visual-relations-tier2-review.bundle.js"></script>
</body>
</html>
